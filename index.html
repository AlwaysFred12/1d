<script>
/* 入口分流：窄屏（手机）走真正重排过的手机版，宽屏走 1440 画布版。
   ?mobile / ?desktop 可强制覆盖；页面锚点（#tools / #news 等）原样带过去。 */
(function () {
  var q = location.search, w = window.innerWidth;
  var forced = /[?&](mobile|desktop)/.exec(q);
  var goMobile = forced ? forced[1] === 'mobile' : w < 700;
  location.replace((goMobile ? 'mobile.html' : 'desktop.html') + location.hash);
})();
</script>
